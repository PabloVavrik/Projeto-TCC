<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Competidor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar_competidor.css') }}">
</head>
<body>

<div class="container">

    <h2>Editar Competidor</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="mensagem">
            {{ messages[0] }}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/atualizar/{{ competidor.id }}" class="form-editar">

        <div class="campo">
            <label>Nome</label>
            <input type="text" name="nome" value="{{ competidor.nome }}" required>
        </div>

        <div class="campo">
            <label>Idade</label>
            <input type="number" name="idade" value="{{ competidor.idade }}" required>
        </div>

        <div class="campo">
            <label>Modalidade</label>
            <input type="text" name="modalidade" value="{{ competidor.modalidade }}" required>
        </div>

        <div class="acoes">
            <button type="submit" class="btn-salvar">Atualizar</button>
            <a href="/competidores" class="btn-voltar">Voltar</a>
        </div>

    </form>

</div>

</body>
</html>
